          accentColor: chosen.color,
          mass: Math.random() * 0.3 + 0.8,
          springY: targetY,
          maxStandTimer: chosen.type === 'BOUNCE' ? config.breakTime * 2.2 : config.breakTime,
          edgeTiltSensitivity: config.tiltSensitivity,
          moveRange: Math.random() * 60 + 60,
          moveSpeed: Math.random() * 0.8 + 1.2
        });

        newPlat.vy = 4.2;
        this.platforms.push(newPlat);
      }

      // --- TRATAMENTO DE COLISÃO AABB ---
      resolveCollisions() {
        const p = this.player;
        let onAnyPlatform = false;

        for (const plat of this.platforms) {
          if (plat.isCollapsing && plat.y > 600) continue;
          if (plat.type === 'GLITCH' && plat.isIntangible) continue;

          const isIntersecting =
            p.x + p.w > plat.x &&
            p.x < plat.x + plat.width &&
            p.y + p.h >= plat.y &&
            p.y < plat.y + plat.height;

          if (isIntersecting) {
            const previousBottom = (p.y - p.vy) + p.h;
            const platformTop = plat.y - plat.vy;

            if (p.vy >= 0 && previousBottom <= platformTop + 14) {
              // Plataforma de choque ativa (VOLT)
              if (plat.type === 'VOLT' && plat.isElectrified) {
                this.handlePlayerShock(plat);
                break;
              }

              // Plataforma Mola (BOUNCE)
              if (plat.type === 'BOUNCE') {
                p.y = plat.y - p.h;
                p.vy = -16.5;
                p.isGrounded = false;
                p.jumpsLeft = 2;
                p.canDash = true;
                p.scaleX = 0.55;
                p.scaleY = 1.7;

                plat.bounceAnim = 1.0;
                sound.playSuperBounce();
                this.screenShake = 6;
                this.particles.emitBounceSparks(p.x + p.w / 2, plat.y);
                plat.applyImpulse(7.5, p.x + p.w / 2);
                break;
              }

              // Plataforma Normal ou Móvel
              p.y = plat.y - p.h;
              p.vy = 0;
              p.isGrounded = true;
              p.jumpsLeft = 2;
              p.canDash = true;
              p.currentPlatform = plat;
              onAnyPlatform = true;

              const platCenter = plat.x + plat.width / 2;
              const playerCenter = p.x + p.w / 2;
              const halfWidth = plat.width / 2;
              const offset = Math.max(-1.3, Math.min(1.3, (playerCenter - platCenter) / halfWidth));

              plat.isBeingStepped = true;
              plat.steppedOffset = offset;

              p.x += plat.vx;

              // Move o jogador junto com a plataforma móvel
              if (plat.type === 'MOVING') {
                p.x += plat.deltaX;
              }

              if (Math.abs(offset) > 0.45) {
                p.vx += offset * 0.35;
              }

              if (p.vy !== plat.vy && Math.abs(p.scaleY - 1.0) < 0.1) {
                p.scaleX = 1.35;
                p.scaleY = 0.65;
                sound.playLand();
                this.particles.emitDust(p.x + p.w / 2, plat.y, '#00ff88', 5);
                plat.applyImpulse(4.5, p.x + p.w / 2);
              }
              break;
            }
          }
        }

        if (!onAnyPlatform) {
          p.isGrounded = false;
          p.currentPlatform = null;
        }

        // --- COLISÃO COM BITS DE DADOS ---
        for (const bit of this.bits) {
          if (!bit.isCollected) {
            const dist = Math.hypot((p.x + p.w / 2) - bit.x, (p.y + p.h / 2) - bit.y);
            if (dist < p.w / 2 + bit.size) {
              bit.isCollected = true;
              this.particles.emitBitCollect(bit.x, bit.y, bit.color);
              this.screenShake = 4;

              // Combo progressivo & pontuação
              this.combo++;
              this.comboTimer = 3.6;
              if (this.combo > this.maxCombo) this.maxCombo = this.combo;
              sound.playComboUp(this.combo);

              // Checa se todos os bits foram coletados para abrir o Portal
              const remaining = this.bits.filter(b => !b.isCollected).length;
              if (remaining === 0) {
                this.portal.setOpen(true, this.getCurrentStageConfig().themeColor);
                this.screenShake = 10;
              }
            }
          }
        }

        // --- COLISÃO COM O PORTAL DIMENSIONAL ---
        if (this.portal.isOpen) {
          const distToPortal = Math.hypot((p.x + p.w / 2) - this.portal.x, (p.y + p.h / 2) - this.portal.y);
          if (distToPortal < this.portal.radius + 4) {
            this.triggerStageWarp();
          }
        }
      }

      handlePlayerShock(plat) {
        sound.playShock();
        this.screenShake = 11;
        this.particles.emitShockParticles(this.player.x + this.player.w / 2, this.player.y + this.player.h / 2);

        const pushDir = this.player.x < plat.x + plat.width / 2 ? -1 : 1;
        this.player.vx = pushDir * 8.5;
        this.player.vy = -9.5;
        this.player.isGrounded = false;
        this.player.currentPlatform = null;
        this.player.canDash = true;
        this.player.jumpsLeft = 1;
        this.player.scaleX = 1.4;
        this.player.scaleY = 0.6;
        this.combo = 0;

        plat.triggerCollapse();

        this.lives--;
        if (this.lives <= 0) {
          this.gameOver();
        }
      }

      handleLaserDamage() {
        sound.playShock();
        this.screenShake = 14;
        this.particles.emitShockParticles(this.player.x + this.player.w / 2, this.player.y + this.player.h / 2);
        this.player.vx = (Math.random() - 0.5) * 12;
        this.player.vy = -10;
        this.player.canDash = true;
        this.combo = 0;

        this.lives--;
        if (this.lives <= 0) {
          this.gameOver();
        }
      }

      handleEnemyDamage(sentinel) {
        sound.playShock();
        this.screenShake = 12;
        this.particles.emitShockParticles(this.player.x + this.player.w / 2, this.player.y + this.player.h / 2);
        const pushDir = this.player.x < sentinel.x + sentinel.w / 2 ? -1 : 1;
        this.player.vx = pushDir * 8.5;
        this.player.vy = -9.5;
        this.player.canDash = true;
        this.combo = 0;

        this.lives--;
        if (this.lives <= 0) {
          this.gameOver();
        }
      }

      triggerStageWarp() {
        if (this.state === 'WARPING') return;
        this.state = 'WARPING';
        this.warpTimer = 1.3;
        sound.playWarpStage();
        this.screenShake = 12;
        this.particles.emitStageCompleteVortex(this.portal.x, this.portal.y, this.portal.color);
      }

      handlePlayerFall() {
        this.lives--;
        sound.playDeath();
        this.screenShake = 12;
        this.particles.emitDeathExplosion(this.player.x, this.height - 20);

        if (this.lives > 0) {
          // Reaparece na base com respawn seguro da mesma fase
          this.player.startX = 480;
          this.player.startY = 240;
          this.player.reset();

          // Garante uma plataforma estável de apoio
          this.platforms.push(new UIPlatform({
            x: 430,
            y: 330,
            width: 100,
            height: 30,
            title: '[ RESPAWN ]',
            accentColor: '#00ff88',
            springY: 330,
            maxStandTimer: this.getCurrentStageConfig().breakTime * 1.5
          }));
        } else {
          this.gameOver();
        }
      }

      gameOver() {
        this.state = 'GAMEOVER';
        this.screenShake = 15;
      }

      update(dt) {
        for (const star of this.bgStars) {
          star.y += star.speed;
          if (star.y > this.height) {
            star.y = 0;
            star.x = Math.random() * this.width;
          }
        }

        if (this.screenShake > 0) {
          this.screenShake *= 0.9;
          if (this.screenShake < 0.1) this.screenShake = 0;
        }

        // Animação de Salto Quântico (Transição de Fase)
        if (this.state === 'WARPING') {
          this.warpTimer -= dt;
          this.portal.update(dt, this.particles);
          this.particles.update();

          if (this.warpTimer <= 0) {
            // Avança para a próxima fase!
            const nextStage = this.currentStageIndex + 1;
            this.loadStage(nextStage, true);
          }
          return;
        }

        if (this.state === 'PLAYING') {
          this.survivalTime += dt;

          if (this.survivalTime > this.highScore) {
            this.highScore = this.survivalTime;
            localStorage.setItem('ultimo_pixel_highscore', this.highScore.toFixed(2));
          }

          const config = this.getCurrentStageConfig();

          // Atualiza Gerador de Plataformas
          this.spawnTimer += dt;
          if (this.spawnTimer >= config.spawnInterval || this.platforms.length < 4) {
            this.spawnRandomPlatform();
            this.spawnTimer = 0;
          }

          // Atualiza Jogador
          this.player.handleInput(this.keys);
          this.player.update(this.particles, dt);

          // Atualiza Portal e Itens
          this.portal.update(dt, this.particles);
          this.bits.forEach(b => b.update(dt));

          // Trilha Sonora Cyberpunk Procedural em Tempo Real
          sound.updateBGM(true);

          // Decaimento do Combo
          if (this.comboTimer > 0) {
            this.comboTimer -= dt;
            if (this.comboTimer <= 0) {
              this.combo = 0;
            }
          }

          // Aura de Overclock quando combo >= 3
          if (this.combo >= 3) {
            this.particles.emitOverclockAura(this.player.x + this.player.w / 2, this.player.y + this.player.h / 2);
          }

          // Atualiza e Dispara Laser de Firewall
          const laserFired = this.firewallLaser.update(dt, this.player.y, sound, this.particles);
          if (laserFired) {
            this.screenShake = 12;
          }
          if (this.firewallLaser.checkPlayerCollision(this.player)) {
            this.handleLaserDamage();
          }

          // Atualiza Inimigos Sentinelas e Colisão (Stomp vs Dano)
          for (const sentinel of this.sentinels) {
            sentinel.update(dt);
            if (!sentinel.isAlive) continue;

            const p = this.player;
            const isIntersecting =
              p.x + p.w > sentinel.x &&
              p.x < sentinel.x + sentinel.w &&
              p.y + p.h >= sentinel.y &&
              p.y < sentinel.y + sentinel.h;

            if (isIntersecting) {
              // STOMP: esmaga se o jogador estiver descendo ou caindo em cima
              if (p.vy > 1.0 && p.y + p.h <= sentinel.y + 12) {
                sentinel.isAlive = false;
                sentinel.respawnTimer = 6.0;
                sound.playEnemyStomp();
                this.screenShake = 8;
                this.particles.emitEnemyExplosion(sentinel.x + sentinel.w / 2, sentinel.y + sentinel.h / 2);

                p.y = sentinel.y - p.h;
                p.vy = -12.5; // Super quique vertical
                p.isGrounded = false;
                p.jumpsLeft = 2;
                p.canDash = true;
                p.scaleX = 0.55;
                p.scaleY = 1.6;

                this.combo++;
                this.comboTimer = 3.6;
                if (this.combo > this.maxCombo) this.maxCombo = this.combo;
                sound.playComboUp(this.combo);
                break;
              } else {
                this.handleEnemyDamage(sentinel);
                break;
              }
            }
          }

          // Queda no Vazio
          if (this.player.y > this.height + 20) {
            this.handlePlayerFall();
          }
        }

        // Atualiza Plataformas
        for (let i = this.platforms.length - 1; i >= 0; i--) {
          const plat = this.platforms[i];
          plat.update(dt, 1.0 + (this.currentStageIndex * 0.1));

          if (plat.isCollapsing && !plat.emittedDebris) {
            plat.emittedDebris = true;
            this.screenShake = 6;
            this.particles.emitCollapseDebris(plat.x, plat.y, plat.width, plat.height, plat.accentColor);
          }

          if (plat.hasFallen) {
            this.platforms.splice(i, 1);
          }
        }

        if (this.state === 'PLAYING') {
          this.resolveCollisions();
        }

        this.particles.update();
      }

      draw() {
        this.ctx.save();

        if (this.screenShake > 0) {
          const sx = (Math.random() - 0.5) * this.screenShake;
          const sy = (Math.random() - 0.5) * this.screenShake;
          this.ctx.translate(sx, sy);
        }

        const config = this.getCurrentStageConfig();

        // Fundo com sutil tonalidade do tema da fase
        this.ctx.fillStyle = '#0a0d14';
        this.ctx.fillRect(0, 0, this.width, this.height);

        // Grade Cibernética
        this.ctx.strokeStyle = 'rgba(0, 240, 255, 0.03)';
        this.ctx.lineWidth = 1;
        const gridSize = 40;
        for (let x = 0; x < this.width; x += gridSize) {
          this.ctx.beginPath();
          this.ctx.moveTo(x, 0);
          this.ctx.lineTo(x, this.height);
          this.ctx.stroke();
        }
        for (let y = 0; y < this.height; y += gridSize) {
          this.ctx.beginPath();
          this.ctx.moveTo(0, y);
          this.ctx.lineTo(this.width, y);
          this.ctx.stroke();
        }

        // Estrelas de fundo
        for (const star of this.bgStars) {
          this.ctx.fillStyle = `rgba(0, 240, 255, ${star.alpha})`;
          this.ctx.fillRect(star.x, star.y, star.size, star.size);
        }

        // Linha de advertência do Vazio
        this.drawVoidDangerLine();

        // Renderiza Raio Laser do Firewall
        this.firewallLaser.draw(this.ctx);

        // Renderiza Inimigos Sentinelas
        for (const sentinel of this.sentinels) {
          sentinel.draw(this.ctx);
        }

        // Renderiza Portal
        this.portal.draw(this.ctx);

        // Renderiza Bits Colecionáveis
        for (const bit of this.bits) {
          bit.draw(this.ctx);
        }

        // Renderiza Plataformas
        for (const plat of this.platforms) {
          plat.draw(this.ctx);
        }

        // Renderiza Partículas
        this.particles.draw(this.ctx);

        // Renderiza Jogador
        if (this.state === 'PLAYING' || this.state === 'START') {
          this.player.draw(this.ctx);
        }

        // HUD Avançado com Fases e Vidas
        this.drawHUD();

        // Telas de Interface
        if (this.state === 'START') {
          this.drawStartOverlay();
        } else if (this.state === 'WARPING') {
          this.drawWarpOverlay();
        } else if (this.state === 'GAMEOVER') {
          this.drawGameOverOverlay();
        }

        this.ctx.restore();
      }

      drawVoidDangerLine() {
        const time = Date.now() * 0.003;
        const pulse = (Math.sin(time) + 1) * 0.5;

        const voidGrad = this.ctx.createLinearGradient(0, this.height - 28, 0, this.height);
        voidGrad.addColorStop(0, 'rgba(255, 0, 85, 0)');
        voidGrad.addColorStop(1, `rgba(255, 0, 85, ${0.15 + pulse * 0.1})`);

        this.ctx.fillStyle = voidGrad;
        this.ctx.fillRect(0, this.height - 28, this.width, 28);

        this.ctx.save();
        this.ctx.strokeStyle = `rgba(255, 51, 102, ${0.35 + pulse * 0.4})`;
        this.ctx.lineWidth = 2;
        this.ctx.setLineDash([8, 8]);
        this.ctx.beginPath();
        this.ctx.moveTo(0, this.height - 4);
        this.ctx.lineTo(this.width, this.height - 4);
        this.ctx.stroke();
        this.ctx.restore();
      }

      drawHUD() {
        this.ctx.save();
        const config = this.getCurrentStageConfig();

        // Placar de Fase Atual
        this.ctx.font = 'bold 15px monospace';
        this.ctx.fillStyle = config.themeColor;
        this.ctx.shadowColor = config.themeColor;
        this.ctx.shadowBlur = 8;
        this.ctx.fillText(`FASE ${config.id}: ${config.name}`, 25, 28);

        // Subtexto com a Missão
        this.ctx.shadowBlur = 0;
        this.ctx.fillStyle = '#8b949e';
        this.ctx.font = '11px monospace';
        this.ctx.fillText(config.sub, 25, 44);

        // Indicador de Dash Quântico
        const dashReady = this.player.canDash && this.player.dashCooldown <= 0;
        this.ctx.font = 'bold 11px monospace';
        this.ctx.fillStyle = dashReady ? '#00f0ff' : '#ff0055';
        this.ctx.shadowColor = this.ctx.fillStyle;
        this.ctx.shadowBlur = dashReady ? 8 : 0;
        this.ctx.fillText(dashReady ? 'DASH: [PRONTO]' : 'DASH: [RECARGA]', 320, 28);

        // Medidor de Combo & Modo Overclock
        if (this.combo > 1) {
          const isOverclock = this.combo >= 3;
          const comboColor = isOverclock ? '#ffd700' : '#39ff14';
          this.ctx.fillStyle = comboColor;
          this.ctx.shadowColor = comboColor;
          this.ctx.shadowBlur = isOverclock ? 14 : 6;
          this.ctx.font = 'bold 12px monospace';
          this.ctx.fillText(isOverclock ? `⚡ OVERCLOCK x${this.combo}! ⚡` : `COMBO x${this.combo}`, 440, 28);

          // Barra de tempo de combo
          const comboRatio = Math.max(0, this.comboTimer / 3.6);
          this.ctx.fillRect(440, 33, 90 * comboRatio, 3);
        }

        // Indicador de Trilha Sonora BGM
        this.ctx.shadowBlur = 0;
        this.ctx.font = '10px monospace';
        this.ctx.fillStyle = sound.bgmMuted ? '#4b5563' : '#a855f7';
        this.ctx.fillText(`[M] SOM: ${sound.bgmMuted ? 'OFF' : 'ON'}`, 570, 28);

        // Contador de Bits de Dados
        const collectedCount = this.bits.filter(b => b.isCollected).length;
        const totalBits = this.bits.length;
        this.ctx.font = 'bold 13px monospace';
        this.ctx.fillStyle = collectedCount === totalBits ? '#00ff88' : '#ffd700';
        this.ctx.shadowColor = this.ctx.fillStyle;
        this.ctx.shadowBlur = 6;
        this.ctx.fillText(`BITS: ${collectedCount}/${totalBits}`, 670, 28);

        // Alerta de Portal Aberto
        if (this.portal.isOpen) {
          const flash = Math.sin(Date.now() * 0.008) > 0;
          this.ctx.fillStyle = flash ? '#00ff88' : '#ffffff';
          this.ctx.shadowColor = '#00ff88';
          this.ctx.shadowBlur = 8;
          this.ctx.font = 'bold 11px monospace';
          this.ctx.fillText('[PORTAL ABERTO!]', 670, 44);
        }

        // Vidas (Pixel Cores)
        this.ctx.shadowBlur = 0;
        this.ctx.fillStyle = '#8b949e';
        this.ctx.font = 'bold 12px monospace';
        this.ctx.fillText('VIDAS:', this.width - 145, 28);
        for (let i = 0; i < this.maxLives; i++) {
          this.ctx.fillStyle = i < this.lives ? '#00ff88' : '#30363d';
          this.ctx.shadowColor = i < this.lives ? '#00ff88' : 'transparent';
          this.ctx.shadowBlur = i < this.lives ? 6 : 0;
          this.ctx.fillRect(this.width - 90 + i * 22, 17, 15, 14);
        }

        this.ctx.restore();
      }

      drawStartOverlay() {
        this.ctx.save();
        this.ctx.fillStyle = 'rgba(10, 13, 20, 0.86)';
        this.ctx.fillRect(0, 0, this.width, this.height);

        const boxW = 660;
        const boxH = 370;
        const boxX = (this.width - boxW) / 2;
        const boxY = 125;

        this.ctx.fillStyle = '#0d1117';
        this.ctx.fillRect(boxX, boxY, boxW, boxH);

        this.ctx.strokeStyle = '#00f0ff';
        this.ctx.shadowColor = '#00f0ff';
        this.ctx.shadowBlur = 16;
        this.ctx.lineWidth = 2;
        this.ctx.strokeRect(boxX, boxY, boxW, boxH);

        this.ctx.fillStyle = '#00f0ff';
        this.ctx.font = 'bold 22px monospace';
        this.ctx.textAlign = 'center';
        this.ctx.fillText('O ÚLTIMO PIXEL: HARDCORE OVERCLOCK', this.width / 2, boxY + 40);

        this.ctx.shadowBlur = 0;
        this.ctx.fillStyle = '#e6edf3';
        this.ctx.font = '12px monospace';
        this.ctx.fillText('• DIFICULDADE EXTREMA: plataformas quebram em fração de segundos (0.8s a 0.28s)!', this.width / 2, boxY + 74);
        this.ctx.fillText('• ⚠ CUIDADO COM LASERS: feixes fulminantes cortam a tela após aviso vermelho.', this.width / 2, boxY + 100);
        this.ctx.fillText('• 👾 ESMAGUE BUGS (STOMP): pule ou aperte [S] em cima dos drones para destruí-los!', this.width / 2, boxY + 126);
        this.ctx.fillText('• ⚡ MODO OVERCLOCK: encadeie bits e stomps em sequência para combo x2, x3...', this.width / 2, boxY + 152);
        this.ctx.fillText('• [Shift] ou [K] ativa o DASH QUÂNTICO para salvar quedas ou desviar no ar.', this.width / 2, boxY + 178);
        this.ctx.fillText('• Mola ▲ BOUNCE ▲ te lança alto; ⚡ 500V ⚡ dá choque; 0x404_GHOST desaparece!', this.width / 2, boxY + 204);
        this.ctx.fillText('• Pressione [M] a qualquer momento para ligar/desligar a Trilha Sonora Synthwave.', this.width / 2, boxY + 230);

        const flash = Math.sin(Date.now() * 0.006) > 0;
        this.ctx.fillStyle = flash ? '#00ff88' : '#38bdf8';
        this.ctx.shadowColor = '#00ff88';
        this.ctx.shadowBlur = flash ? 14 : 4;
        this.ctx.font = 'bold 16px monospace';
        this.ctx.fillText('Pressione [ESPAÇO] ou [W] para Iniciar', this.width / 2, boxY + 310);

        this.ctx.restore();
      }

      drawWarpOverlay() {
        this.ctx.save();
        const flash = (Math.sin(Date.now() * 0.015) + 1) * 0.5;
        this.ctx.fillStyle = `rgba(0, 240, 255, ${0.2 + flash * 0.25})`;
        this.ctx.fillRect(0, 0, this.width, this.height);

        this.ctx.textAlign = 'center';
        this.ctx.fillStyle = '#ffffff';
        this.ctx.shadowColor = '#00f0ff';
        this.ctx.shadowBlur = 24;
        this.ctx.font = 'bold 32px monospace';
        this.ctx.fillText('SALTO DIMENSIONAL CONCLUÍDO!', this.width / 2, this.height / 2 - 10);

        this.ctx.font = '16px monospace';
        this.ctx.fillStyle = '#00ff88';
        this.ctx.fillText('Carregando próximo setor...', this.width / 2, this.height / 2 + 30);

        this.ctx.restore();
      }

      drawGameOverOverlay() {
        this.ctx.save();
        this.ctx.fillStyle = 'rgba(7, 9, 14, 0.88)';
        this.ctx.fillRect(0, 0, this.width, this.height);

        this.ctx.textAlign = 'center';
        this.ctx.fillStyle = '#ff0055';
        this.ctx.shadowColor = '#ff0055';
        this.ctx.shadowBlur = 20;
        this.ctx.font = 'bold 36px monospace';
        this.ctx.fillText('SISTEMA CORROMPIDO', this.width / 2, 220);

        this.ctx.shadowBlur = 0;
        this.ctx.fillStyle = '#8b949e';
        this.ctx.font = '15px monospace';
        this.ctx.fillText('Você perdeu todos os seus Pixel Cores de backup.', this.width / 2, 260);

        const config = this.getCurrentStageConfig();
        this.ctx.fillStyle = '#00f0ff';
        this.ctx.font = 'bold 20px monospace';
        this.ctx.fillText(`Alcançou: Fase ${config.id} - ${config.name}`, this.width / 2, 310);
        this.ctx.fillText(`Tempo Total: ${this.survivalTime.toFixed(2)}s`, this.width / 2, 340);

        const btnW = 260;
        const btnH = 50;
        const btnX = this.width / 2 - btnW / 2;
        const btnY = 395;

        this.ctx.fillStyle = '#161b22';
        this.ctx.fillRect(btnX, btnY, btnW, btnH);

        this.ctx.strokeStyle = '#00ff88';
        this.ctx.shadowColor = '#00ff88';
        this.ctx.shadowBlur = 10;
        this.ctx.lineWidth = 2;
        this.ctx.strokeRect(btnX, btnY, btnW, btnH);

        this.ctx.fillStyle = '#00ff88';
        this.ctx.font = 'bold 15px monospace';
        this.ctx.fillText('REINICIAR CAMPANHA [R]', this.width / 2, btnY + 31);

        this.ctx.restore();
      }

      loop(timestamp) {
        const dt = Math.min((timestamp - this.lastTime) / 1000, 0.1);
        this.lastTime = timestamp;

        this.update(dt);
        this.draw();

        requestAnimationFrame((t) => this.loop(t));
      }

      start() {
        requestAnimationFrame((t) => {
          this.lastTime = t;
          this.loop(t);
        });
      }
    }

    // Inicialização da Engine quando a página carrega
    window.addEventListener('load', () => {
      const game = new GameEngine('gameCanvas');
      game.start();
    });
  </script>
</body>
</html>
