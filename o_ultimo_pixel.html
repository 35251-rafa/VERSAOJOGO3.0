<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O Último Pixel - Portal Quântico & Fases Progressivas</title>
  <style>
    /* ==========================================================================
       ESTILOS GERAIS & TEMA DARK NEON CYBERPUNK
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #05070a;
      color: #e6edf3;
      font-family: 'Consolas', 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Container do Jogo com Proporção Fixa */
    #game-container {
      position: relative;
      width: 960px;
      height: 640px;
      max-width: 98vw;
      max-height: 92vh;
      aspect-ratio: 960 / 640;
      background: radial-gradient(circle at 50% 35%, #101726 0%, #0a0d14 70%, #030508 100%);
      border: 2px solid #1f2937;
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.2), inset 0 0 50px rgba(0, 0, 0, 0.85);
      border-radius: 8px;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    /* Linhas de Varredura Estilo CRT */
    .crt-overlay {
      pointer-events: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.22) 50%
      ), linear-gradient(
        90deg,
        rgba(255, 0, 0, 0.02),
        rgba(0, 255, 0, 0.01),
        rgba(0, 0, 255, 0.02)
      );
      background-size: 100% 4px, 6px 100%;
      z-index: 10;
    }

    /* Vinheta periférica escura */
    .vignette {
      pointer-events: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-shadow: inset 0 0 110px rgba(0, 0, 0, 0.88);
      z-index: 11;
    }

    /* Barra de Ajuda */
    .controls-hint {
      margin-top: 10px;
      font-size: 13px;
      color: #7d8590;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .controls-hint span {
      color: #00f0ff;
      border: 1px solid #30363d;
      padding: 2px 6px;
      border-radius: 4px;
      background: #161b22;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="960" height="640"></canvas>
    <div class="crt-overlay"></div>
    <div class="vignette"></div>
  </div>

  <div class="controls-hint">
    Mover: <span>A / D</span> ou <span>← / →</span> | Pulo & Pulo Duplo: <span>W / Espaço / ↑</span> | Reiniciar Fase: <span>R</span>
  </div>

  <script>
    /**
     * ============================================================================
     * O ÚLTIMO PIXEL - SISTEMA DE FASES & PORTAL DIMENSIONAL
     * ============================================================================
     * - Coleta de Bits de Dados para estabilizar o Portal Dimensional.
     * - 5 Fases progressivas e balanceadas + Modo Infinito Prestígio.
     * - Plataformas que tombam e escorregam nas pontas com quebra cronometrada.
     * - Sistema de Vidas (Pixel Cores) e checkpoints inteligentes por fase.
     * - 100% Vanilla JS + HTML5 Canvas 2D + Web Audio API procedural.
     */

    // --- 1. SÍNTESE DE ÁUDIO PROCEDURAL (ZERO DEPENDÊNCIAS) ---
    class SoundFX {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioClass = window.AudioContext || window.webkitAudioContext;
          if (AudioClass) this.ctx = new AudioClass();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playJump() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.exponentialRampToValueAtTime(640, now + 0.1);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.11);
      }

      playDoubleJump() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(500, now);
        osc.frequency.exponentialRampToValueAtTime(980, now + 0.13);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.13);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.14);
      }

      playLand() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.07);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.07);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      }

      playCollectBit() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.04);
          gain.gain.setValueAtTime(0.08, now + i * 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.04 + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.04);
          osc.stop(now + i * 0.04 + 0.13);
        });
      }

      playPortalOpen() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.4);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.5);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.52);
      }

      playWarpStage() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        for (let i = 0; i < 6; i++) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(300 + i * 160, now + i * 0.06);
          osc.frequency.linearRampToValueAtTime(800 + i * 200, now + i * 0.06 + 0.1);
          gain.gain.setValueAtTime(0.12, now + i * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.06);
          osc.stop(now + i * 0.06 + 0.13);
        }
      }

      playTick() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(760, now);
        gain.gain.setValueAtTime(0.04, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.04);
      }

      playSlide() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(190, now);
        osc.frequency.linearRampToValueAtTime(280, now + 0.05);
        gain.gain.setValueAtTime(0.03, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.06);
      }

      playCollapse() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.28);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.29);
      }

      playDeath() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.linearRampToValueAtTime(60, now + 0.5);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.6);
      }
    }

    const sound = new SoundFX();

    // --- 2. SISTEMA DE PARTÍCULAS NEON ---
    class Particle {
      constructor(x, y, vx, vy, color, size, life, shape = 'square', gravity = 0.15) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.size = size;
        this.life = life;
        this.maxLife = life;
        this.shape = shape;
        this.gravity = gravity;
        this.drag = 0.96;
      }

      update() {
        this.vx *= this.drag;
        this.vy *= this.drag;
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
        return this.life > 0;
      }

      draw(ctx) {
        const progress = this.life / this.maxLife;
        ctx.save();
        ctx.globalAlpha = Math.max(0, progress);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 8;

        const currentSize = this.size * (0.3 + 0.7 * progress);

        if (this.shape === 'square') {
          ctx.fillRect(this.x - currentSize / 2, this.y - currentSize / 2, currentSize, currentSize);
        } else {
          ctx.beginPath();
          ctx.arc(this.x, this.y, currentSize / 2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    class ParticleSystem {
      constructor() {
        this.particles = [];
      }

      add(particle) {
        this.particles.push(particle);
      }

      emitDust(x, y, color = '#00ff88', count = 6, angleSpread = Math.PI, speed = 2.8) {
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI / 2) + (Math.random() - 0.5) * angleSpread;
          const spd = Math.random() * speed + 1;
          const vx = Math.cos(angle) * spd;
          const vy = -Math.sin(angle) * spd;
          const size = Math.random() * 3 + 2;
          const life = Math.floor(Math.random() * 18 + 12);
          this.add(new Particle(x, y, vx, vy, color, size, life, 'square', 0.1));
        }
      }

      emitCollapseDebris(x, y, w, h, color = '#00f0ff') {
        const count = Math.min(26, Math.floor((w * h) / 75));
        for (let i = 0; i < count; i++) {
          const px = x + Math.random() * w;
          const py = y + Math.random() * h;
          const vx = (Math.random() - 0.5) * 7;
          const vy = (Math.random() - 0.8) * 6;
          const size = Math.random() * 5 + 2;
          const life = Math.floor(Math.random() * 35 + 20);
          const colors = [color, '#ff3366', '#ffffff', '#b537f2'];
          const chosenColor = colors[Math.floor(Math.random() * colors.length)];
          this.add(new Particle(px, py, vx, vy, chosenColor, size, life, 'square', 0.25));
        }
      }

      emitPortalSparks(x, y, color = '#00f0ff') {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * 45 + 25;
        const px = x + Math.cos(angle) * dist;
        const py = y + Math.sin(angle) * dist;
        const vx = (x - px) * 0.05 + (Math.random() - 0.5) * 2;
        const vy = (y - py) * 0.05 + (Math.random() - 0.5) * 2;
        this.add(new Particle(px, py, vx, vy, color, Math.random() * 3 + 2, 25, 'circle', 0));
      }

      emitBitCollect(x, y, color = '#ffd700') {
        for (let i = 0; i < 24; i++) {
          const angle = Math.random() * Math.PI * 2;
          const spd = Math.random() * 6 + 2;
          this.add(new Particle(x, y, Math.cos(angle) * spd, Math.sin(angle) * spd, color, Math.random() * 4 + 2, 28, 'square', 0.05));
        }
      }

      emitStageCompleteVortex(x, y, color = '#00f0ff') {
        for (let i = 0; i < 60; i++) {
          const angle = Math.random() * Math.PI * 2;
          const spd = Math.random() * 9 + 3;
          this.add(new Particle(x, y, Math.cos(angle) * spd, Math.sin(angle) * spd, color, Math.random() * 5 + 3, 40, 'square', 0.08));
        }
      }

      emitDeathExplosion(x, y) {
        for (let i = 0; i < 50; i++) {
          const angle = Math.random() * Math.PI * 2;
          const spd = Math.random() * 8 + 2;
          this.add(new Particle(x, y, Math.cos(angle) * spd, Math.sin(angle) * spd, '#00ff88', Math.random() * 4 + 2, 45, 'square', 0.15));
        }
      }

      update() {
        for (let i = this.particles.length - 1; i >= 0; i--) {
          if (!this.particles[i].update()) {
            this.particles.splice(i, 1);
          }
        }
      }

      draw(ctx) {
        for (const p of this.particles) {
          p.draw(ctx);
        }
      }

      clear() {
        this.particles = [];
      }
    }

    // --- 3. ITENS COLECIONÁVEIS: BITS DE DADOS NEON ---
    class CollectibleBit {
      constructor(x, y, id) {
        this.x = x;
        this.baseY = y;
        this.y = y;
        this.id = id;
        this.size = 14;
        this.isCollected = false;
        this.floatOffset = Math.random() * Math.PI * 2;
        this.color = '#ffd700';
      }

      update(dt) {
        this.floatOffset += dt * 3.5;
        this.y = this.baseY + Math.sin(this.floatOffset) * 6;
      }

      draw(ctx) {
        if (this.isCollected) return;

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.floatOffset * 0.7);

        ctx.shadowColor = this.color;
        ctx.shadowBlur = 15;

        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.moveTo(0, -this.size);
        ctx.lineTo(this.size * 0.8, 0);
        ctx.lineTo(0, this.size);
        ctx.lineTo(-this.size * 0.8, 0);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, 0, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    // --- 4. O PORTAL DIMENSIONAL (OBJETIVO DA FASE) ---
    class DimensionalPortal {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 32;
        this.isOpen = false;
        this.angle = 0;
        this.pulse = 0;
        this.color = '#00f0ff';
        this.particlesCooldown = 0;
      }

      setOpen(open, color = '#00f0ff') {
        if (!this.isOpen && open) {
          sound.playPortalOpen();
        }
        this.isOpen = open;
        this.color = color;
      }

      update(dt, particleSystem) {
        this.angle += dt * 2.8;
        this.pulse = Math.sin(Date.now() * 0.005) * 4;

        if (this.isOpen) {
          this.particlesCooldown -= dt;
          if (this.particlesCooldown <= 0) {
            particleSystem.emitPortalSparks(this.x, this.y, this.color);
            this.particlesCooldown = 0.08;
          }
        }
      }

      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);

        const currentRadius = this.radius + this.pulse;

        if (!this.isOpen) {
          ctx.strokeStyle = '#4b5563';
          ctx.lineWidth = 3;
          ctx.setLineDash([6, 6]);
          ctx.beginPath();
          ctx.arc(0, 0, currentRadius, 0, Math.PI * 2);
          ctx.stroke();

          ctx.fillStyle = '#6b7280';
          ctx.font = 'bold 12px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('PORTAL', 0, -5);
          ctx.font = '10px monospace';
          ctx.fillStyle = '#ef4444';
          ctx.fillText('[TRAVADO]', 0, 10);
        } else {
          ctx.shadowColor = this.color;
          ctx.shadowBlur = 25;

          const grad = ctx.createRadialGradient(0, 0, 4, 0, 0, currentRadius);
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(0.3, this.color);
          grad.addColorStop(0.8, '#b537f2');
          grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(0, 0, currentRadius, 0, Math.PI * 2);
          ctx.fill();

          ctx.save();
          ctx.rotate(this.angle);
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.setLineDash([12, 8]);
          ctx.beginPath();
          ctx.arc(0, 0, currentRadius + 4, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();

          ctx.save();
          ctx.rotate(-this.angle * 1.5);
          ctx.strokeStyle = this.color;
          ctx.lineWidth = 3;
          ctx.setLineDash([8, 14]);
          ctx.beginPath();
          ctx.arc(0, 0, currentRadius - 8, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();

          ctx.shadowBlur = 8;
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 11px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('▼ ENTRE ▼', 0, -currentRadius - 10);
        }

        ctx.restore();
      }
    }

    // --- 5. PLATAFORMAS FÍSICAS (QUADRADOS DINÂMICOS & GANGORRA) ---
    class UIPlatform {
      constructor({
        x,
        y,
        width,
        height,
        title = 'UI',
        type = 'BUTTON',
        accentColor = '#00f0ff',
        mass = 1.0,
        springY = null,
        maxStandTimer = 0.95,
        edgeTiltSensitivity = 1.0
      }) {
        this.x = x;
        this.y = y;
        this.targetY = springY !== null ? springY : y;
        this.width = width;
        this.height = height;
        this.title = title;
        this.type = type;
        this.accentColor = accentColor;
        this.mass = mass;
        this.edgeTiltSensitivity = edgeTiltSensitivity;

        this.vx = 0;
        this.vy = 0;
        this.angle = 0;
        this.vAngle = 0;
        this.kSpring = 0.08 / mass;
        this.damping = 0.88;

        this.maxStandTimer = maxStandTimer;
        this.standTimer = maxStandTimer;
        this.isBeingStepped = false;
        this.steppedOffset = 0;

        this.hasFallen = false;
        this.isCollapsing = false;
        this.alpha = 1.0;
        this.shakeOffset = { x: 0, y: 0 };
        this.tickCooldown = 0;
        this.slideSoundCooldown = 0;

        this.isSpawning = true;
      }

      update(dt, globalGravityMultiplier) {
        if (this.y > 750) {
          this.hasFallen = true;
          return;
        }

        if (this.isBeingStepped && !this.isCollapsing) {
          this.standTimer -= dt;
          this.tickCooldown -= dt;
          this.slideSoundCooldown -= dt;

          if (this.standTimer < this.maxStandTimer * 0.7 && this.tickCooldown <= 0) {
            sound.playTick();
            this.tickCooldown = Math.max(0.04, this.standTimer * 0.22);
          }

          const panic = 1.0 - (this.standTimer / this.maxStandTimer);
          const shakeMag = panic * 8;
          this.shakeOffset.x = (Math.random() - 0.5) * shakeMag;
          this.shakeOffset.y = (Math.random() - 0.5) * shakeMag;

          // Física de Gangorra & Deslize nas Pontas
          if (Math.abs(this.steppedOffset) > 0.15) {
            const pushAccel = this.steppedOffset * 0.95 * this.edgeTiltSensitivity;
            this.vx += pushAccel;

            const targetAngle = this.steppedOffset * 0.32 * this.edgeTiltSensitivity;
            this.angle += (targetAngle - this.angle) * 0.22;

            if (this.slideSoundCooldown <= 0 && Math.abs(this.vx) > 1.2) {
              sound.playSlide();
              this.slideSoundCooldown = 0.16;
            }
          }

          if (this.standTimer <= 0) {
            this.triggerCollapse();
          }
        } else {
          this.shakeOffset.x = 0;
          this.shakeOffset.y = 0;
          this.angle += (0 - this.angle) * 0.12;
        }

        if (this.isCollapsing) {
          const gravity = 0.58 * globalGravityMultiplier;
          this.vy += gravity;
          this.vAngle += 0.008 * (this.x % 2 === 0 ? 1 : -1);
          this.angle += this.vAngle;
          this.y += this.vy;
          this.x += this.vx;
          this.alpha = Math.max(0.2, 1 - (this.vy / 16));
        } else {
          this.x += this.vx;
          this.vx *= 0.88;

          if (this.x < 15) {
            this.x = 15;
            this.vx = Math.abs(this.vx) * 0.4;
          } else if (this.x + this.width > 945) {
            this.x = 945 - this.width;
            this.vx = -Math.abs(this.vx) * 0.4;
          }

          const displacement = this.y - this.targetY;
          const springForce = -this.kSpring * displacement;
          
          this.vy += springForce;
          this.vy *= this.damping;
          this.y += this.vy;

          if (this.isSpawning && Math.abs(this.y - this.targetY) < 4) {
            this.isSpawning = false;
          }
        }

        this.isBeingStepped = false;
      }

      applyImpulse(forceY, impactX) {
        this.vy += forceY / this.mass;
        const relativeX = (impactX - (this.x + this.width / 2)) / (this.width / 2);
        this.angle = relativeX * 0.12;
      }

      triggerCollapse() {
        if (this.isCollapsing) return;
        this.isCollapsing = true;
        this.vy = 2.4;
        sound.playCollapse();
      }

      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = this.alpha;

        const drawX = this.x + this.shakeOffset.x;
        const drawY = this.y + this.shakeOffset.y;

        ctx.translate(drawX + this.width / 2, drawY + this.height / 2);
        ctx.rotate(this.angle);
        ctx.translate(-(this.width / 2), -(this.height / 2));

        let currentBorderColor = this.accentColor;
        let glowColor = this.accentColor;

        if (this.standTimer < this.maxStandTimer) {
          const ratio = this.standTimer / this.maxStandTimer;
          if (ratio < 0.65) {
            const flash = Math.sin(Date.now() * 0.045) > 0;
            currentBorderColor = flash ? '#ff0055' : '#ffaa00';
            glowColor = '#ff0055';
          }
        }

        ctx.shadowColor = glowColor;
        ctx.shadowBlur = this.isBeingStepped ? 16 : 7;

        ctx.fillStyle = '#0f1420';
        ctx.fillRect(0, 0, this.width, this.height);

        ctx.strokeStyle = currentBorderColor;
        ctx.lineWidth = 2;
        ctx.strokeRect(0, 0, this.width, this.height);

        if (this.type === 'ALERT') {
          ctx.fillStyle = currentBorderColor;
          ctx.fillRect(0, 0, this.width, 3);
        }

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(this.title, this.width / 2, this.height / 2 + 4);
        ctx.textAlign = 'left';

        ctx.fillStyle = this.accentColor;
        ctx.fillRect(2, this.height - 4, 3, 2);
        ctx.fillRect(this.width - 5, this.height - 4, 3, 2);

        if (this.standTimer < this.maxStandTimer && !this.isCollapsing) {
          const timerRatio = Math.max(0, this.standTimer / this.maxStandTimer);
          ctx.fillStyle = '#ff0055';
          ctx.fillRect(0, this.height - 3, this.width * (1 - timerRatio), 3);
        }

        ctx.restore();
      }
    }

    // --- 6. CLASSE DO JOGADOR ("O ÚLTIMO PIXEL") ---
    class Player {
      constructor(x, y) {
        this.startX = x;
        this.startY = y;
        this.reset();
      }

      reset() {
        this.x = this.startX;
        this.y = this.startY;
        this.w = 16;
        this.h = 16;
        this.vx = 0;
        this.vy = 0;

        this.speed = 5.8;
        this.friction = 0.83;
        this.gravity = 0.50;
        this.jumpForce = -11.0;
        this.doubleJumpForce = -9.8;

        this.jumpsLeft = 2;
        this.isGrounded = false;
        this.currentPlatform = null;

        this.scaleX = 1.0;
        this.scaleY = 1.0;

        this.trail = [];
        this.maxTrail = 6;
      }

      handleInput(keys) {
        let moveDir = 0;
        if (keys['ArrowLeft'] || keys['KeyA']) moveDir -= 1;
        if (keys['ArrowRight'] || keys['KeyD']) moveDir += 1;

        if (moveDir !== 0) {
          this.vx += moveDir * 1.15;
          if (Math.abs(this.vx) > this.speed) {
            this.vx = Math.sign(this.vx) * this.speed;
          }
        }
      }

      jump(particleSystem, sound) {
        if (this.jumpsLeft > 0) {
          const isFirstJump = this.jumpsLeft === 2;
          this.vy = isFirstJump ? this.jumpForce : this.doubleJumpForce;
          this.isGrounded = false;
          this.currentPlatform = null;
          this.jumpsLeft--;

          this.scaleX = 0.7;
          this.scaleY = 1.4;

          if (isFirstJump) {
            sound.playJump();
            particleSystem.emitDust(this.x + this.w / 2, this.y + this.h, '#00ff88', 8);
          } else {
            sound.playDoubleJump();
            particleSystem.emitDust(this.x + this.w / 2, this.y + this.h, '#00f0ff', 14, Math.PI * 2, 4);
          }
        }
      }

      update(particleSystem) {
        this.vy += this.gravity;
        this.vx *= this.isGrounded ? this.friction : 0.94;

        if (this.isGrounded && this.currentPlatform) {
          this.y = this.currentPlatform.y - this.h;
          this.vy = this.currentPlatform.vy;
        } else {
          this.y += this.vy;
        }

        this.x += this.vx;

        this.scaleX += (1.0 - this.scaleX) * 0.15;
        this.scaleY += (1.0 - this.scaleY) * 0.15;

        if (this.x < 0) {
          this.x = 0;
          this.vx = 0;
        } else if (this.x + this.w > 960) {
          this.x = 960 - this.w;
          this.vx = 0;
        }

        this.trail.unshift({ x: this.x, y: this.y });
        if (this.trail.length > this.maxTrail) {
          this.trail.pop();
        }
      }

      draw(ctx) {
        ctx.save();

        for (let i = 0; i < this.trail.length; i++) {
          const t = this.trail[i];
          const alpha = (1 - (i / this.trail.length)) * 0.35;
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = '#00ff88';
          ctx.shadowColor = '#00ff88';
          ctx.shadowBlur = 6;
          ctx.fillRect(t.x + 2, t.y + 2, this.w - 4, this.h - 4);
          ctx.restore();
        }

        ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
        ctx.scale(this.scaleX, this.scaleY);
        ctx.translate(-(this.w / 2), -(this.h / 2));

        ctx.shadowColor = '#00ff88';
        ctx.shadowBlur = 18;

        ctx.fillStyle = '#00ff88';
        ctx.fillRect(0, 0, this.w, this.h);

        ctx.shadowBlur = 4;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(3, 3, this.w - 6, this.h - 6);

        ctx.fillStyle = '#003311';
        ctx.fillRect(this.vx >= 0 ? 9 : 3, 5, 4, 4);

        ctx.restore();
      }
    }

    // --- 8. MOTOR PRINCIPAL DO JOGO (GAME ENGINE COM MÚLTIPLAS FASES) ---
    class GameEngine {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.width = this.canvas.width;
        this.height = this.canvas.height;

        this.particles = new ParticleSystem();
        this.player = new Player(480, 240);
        this.portal = new DimensionalPortal(830, 150);

        this.platforms = [];
        this.bits = [];
        this.keys = {};

        this.state = 'START';
        this.currentStageIndex = 0;
        this.lives = 3;
        this.maxLives = 3;
        this.survivalTime = 0.0;
        this.highScore = parseFloat(localStorage.getItem('ultimo_pixel_highscore')) || 0.0;
        this.spawnTimer = 0;
        this.screenShake = 0;

        this.warpTimer = 0;
        this.warpProgress = 0;

        this.bgStars = [];
        for (let i = 0; i < 45; i++) {
          this.bgStars.push({
            x: Math.random() * this.width,
            y: Math.random() * this.height,
            size: Math.random() * 2 + 1,
            speed: Math.random() * 0.4 + 0.1,
            alpha: Math.random() * 0.6 + 0.2
          });
        }

        this.lastTime = performance.now();
        this.initEvents();
        this.loadStage(0, false);
      }

      getCurrentStageConfig() {
        if (this.currentStageIndex < STAGE_CONFIGS.length) {
          return STAGE_CONFIGS[this.currentStageIndex];
        }
        const loopCount = this.currentStageIndex - STAGE_CONFIGS.length + 1;
        return {
          id: this.currentStageIndex + 1,
          name: `SETOR ÔMEGA+ [LOOP ${loopCount}]`,
          sub: "Modo Prestígio Infinito: Alta velocidade!",
          requiredBits: 4,
          breakTime: Math.max(0.55, 0.68 - loopCount * 0.03),
          minWidth: 42,
          maxWidth: 52,
          tiltSensitivity: 1.6,
          themeColor: '#38bdf8',
          portalPos: { x: 480, y: 100 },
          bitPositions: [
            { x: 180, y: 220 },
            { x: 780, y: 220 },
            { x: 320, y: 360 },
            { x: 640, y: 360 }
          ],
          spawnInterval: 0.9
        };
      }

      loadStage(index, autoPlay = true) {
        this.currentStageIndex = index;
        const config = this.getCurrentStageConfig();

        this.particles.clear();
        this.platforms = [];
        this.bits = [];

        this.portal = new DimensionalPortal(config.portalPos.x, config.portalPos.y);
        this.portal.setOpen(false, config.themeColor);

        config.bitPositions.forEach((pos, idx) => {
          this.bits.push(new CollectibleBit(pos.x, pos.y, idx));
        });

        this.platforms.push(new UIPlatform({
          x: 430,
          y: 330,
          width: 100,
          height: 30,
          title: `[ BASE_${config.id} ]`,
          type: 'BUTTON',
          accentColor: config.themeColor,
          mass: 1.4,
          springY: 330,
          maxStandTimer: config.breakTime * 1.3,
          edgeTiltSensitivity: config.tiltSensitivity
        }));

        this.platforms.push(new UIPlatform({
          x: 200,
          y: 260,
          width: 70,
          height: 28,
          title: '[ RUN ]',
          accentColor: '#00ff88',
          springY: 260,
          maxStandTimer: config.breakTime,
          edgeTiltSensitivity: config.tiltSensitivity
        }));

        this.platforms.push(new UIPlatform({
          x: 690,
          y: 260,
          width: 70,
          height: 28,
          title: '[ CPU ]',
          accentColor: '#b537f2',
          springY: 260,
          maxStandTimer: config.breakTime,
          edgeTiltSensitivity: config.tiltSensitivity
        }));

        this.platforms.push(new UIPlatform({
          x: 130,
          y: 420,
          width: 65,
          height: 28,
          title: '404',
          type: 'ALERT',
          accentColor: '#ffaa00',
          springY: 420,
          maxStandTimer: config.breakTime,
          edgeTiltSensitivity: config.tiltSensitivity
        }));

        this.platforms.push(new UIPlatform({
          x: 760,
          y: 420,
          width: 65,
          height: 28,
          title: '[ RAM ]',
          accentColor: '#00f0ff',
          springY: 420,
          maxStandTimer: config.breakTime,
          edgeTiltSensitivity: config.tiltSensitivity
        }));

        this.player.startX = 480;
        this.player.startY = 240;
        this.player.reset();

        this.spawnTimer = 0;
        if (autoPlay) {
          this.state = 'PLAYING';
        }
      }

      initEvents() {
        window.addEventListener('keydown', (e) => {
          this.keys[e.code] = true;
          sound.init();

          if ((e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') && !e.repeat) {
            e.preventDefault();
            if (this.state === 'START') {
              this.state = 'PLAYING';
              this.player.jump(this.particles, sound);
            } else if (this.state === 'PLAYING') {
              this.player.jump(this.particles, sound);
            }
          }

          if (e.code === 'KeyR' && !e.repeat) {
            if (this.state === 'GAMEOVER' || this.state === 'VICTORY') {
              this.lives = this.maxLives;
              this.loadStage(0, true);
            } else if (this.state === 'PLAYING') {
              this.loadStage(this.currentStageIndex, true);
            }
          }
        });

        window.addEventListener('keyup', (e) => {
          this.keys[e.code] = false;
        });

        this.canvas.addEventListener('mousedown', (e) => {
          sound.init();
          const rect = this.canvas.getBoundingClientRect();
          const clickX = (e.clientX - rect.left) * (this.width / rect.width);
          const clickY = (e.clientY - rect.top) * (this.height / rect.height);

          if (this.state === 'START') {
            this.state = 'PLAYING';
          } else if (this.state === 'GAMEOVER' || this.state === 'VICTORY') {
            if (
              clickX >= this.width / 2 - 130 &&
              clickX <= this.width / 2 + 130 &&
              clickY >= 400 &&
              clickY <= 455
            ) {
              this.lives = this.maxLives;
              this.loadStage(0, true);
            }
          }
        });
      }

      spawnRandomPlatform() {
        const config = this.getCurrentStageConfig();
        const miniCatalog = [
          { title: '[ OK ]', type: 'BUTTON', color: '#00ff88' },
          { title: '[ X ]', type: 'ALERT', color: '#ff0055' },
          { title: '404', type: 'ALERT', color: '#ffaa00' },
          { title: 'CPU', type: 'BUTTON', color: '#00f0ff' },
          { title: 'RAM', type: 'BUTTON', color: '#b537f2' },
          { title: 'DEL', type: 'BUTTON', color: '#ff3366' },
          { title: 'BUG', type: 'ALERT', color: '#e879f9' },
          { title: 'RUN', type: 'BUTTON', color: '#38bdf8' },
          { title: 'ESC', type: 'BUTTON', color: '#f59e0b' },
          { title: '[ ! ]', type: 'ALERT', color: '#ef4444' },
          { title: 'SYS', type: 'BUTTON', color: '#10b981' },
          { title: 'ZIP', type: 'BUTTON', color: '#8b5cf6' },
          { title: 'BIT', type: 'BUTTON', color: '#06b6d4' }
        ];

        const chosen = miniCatalog[Math.floor(Math.random() * miniCatalog.length)];
        const width = Math.floor(Math.random() * (config.maxWidth - config.minWidth) + config.minWidth);
        const height = 28;

        const minX = 40;
        const maxX = this.width - width - 40;
        const spawnX = Math.random() * (maxX - minX) + minX;
        const targetY = Math.random() * (this.height - 240) + 120;

        const newPlat = new UIPlatform({
          x: spawnX,
          y: -50,
          width: width,
          height: height,
          title: chosen.title,
          type: chosen.type,
          accentColor: chosen.color,
          mass: Math.random() * 0.3 + 0.8,
          springY: targetY,
          maxStandTimer: config.breakTime,
          edgeTiltSensitivity: config.tiltSensitivity
        });

        newPlat.vy = 4.2;
        this.platforms.push(newPlat);
      }

      resolveCollisions() {
        const p = this.player;
        let onAnyPlatform = false;

        for (const plat of this.platforms) {
          if (plat.isCollapsing && plat.y > 600) continue;

          const isIntersecting =
            p.x + p.w > plat.x &&
            p.x < plat.x + plat.width &&
            p.y + p.h >= plat.y &&
            p.y < plat.y + plat.height;

          if (isIntersecting) {
            const previousBottom = (p.y - p.vy) + p.h;
            const platformTop = plat.y - plat.vy;

            if (p.vy >= 0 && previousBottom <= platformTop + 14) {
              p.y = plat.y - p.h;
              p.vy = 0;
              p.isGrounded = true;
              p.jumpsLeft = 2;
              p.currentPlatform = plat;
              onAnyPlatform = true;

              const platCenter = plat.x + plat.width / 2;
              const playerCenter = p.x + p.w / 2;
              const halfWidth = plat.width / 2;
              const offset = Math.max(-1.3, Math.min(1.3, (playerCenter - platCenter) / halfWidth));

              plat.isBeingStepped = true;
              plat.steppedOffset = offset;

              p.x += plat.vx;

              if (Math.abs(offset) > 0.45) {
                p.vx += offset * 0.35;
              }

              if (p.vy !== plat.vy && Math.abs(p.scaleY - 1.0) < 0.1) {
                p.scaleX = 1.35;
                p.scaleY = 0.65;
                sound.playLand();
                this.particles.emitDust(p.x + p.w / 2, plat.y, '#00ff88', 5);
                plat.applyImpulse(4.5, p.x + p.w / 2);
              }
              break;
            }
          }
        }

        if (!onAnyPlatform) {
          p.isGrounded = false;
          p.currentPlatform = null;
        }

        for (const bit of this.bits) {
          if (!bit.isCollected) {
            const dist = Math.hypot((p.x + p.w / 2) - bit.x, (p.y + p.h / 2) - bit.y);
            if (dist < p.w / 2 + bit.size) {
              bit.isCollected = true;
              sound.playCollectBit();
              this.particles.emitBitCollect(bit.x, bit.y, bit.color);
              this.screenShake = 3;

              const remaining = this.bits.filter(b => !b.isCollected).length;
              if (remaining === 0) {
                this.portal.setOpen(true, this.getCurrentStageConfig().themeColor);
                this.screenShake = 9;
              }
            }
          }
        }

        if (this.portal.isOpen) {
          const distToPortal = Math.hypot((p.x + p.w / 2) - this.portal.x, (p.y + p.h / 2) - this.portal.y);
          if (distToPortal < this.portal.radius + 4) {
            this.triggerStageWarp();
          }
        }
      }

      triggerStageWarp() {
        if (this.state === 'WARPING') return;
        this.state = 'WARPING';
        this.warpTimer = 1.3;
        sound.playWarpStage();
        this.screenShake = 12;
        this.particles.emitStageCompleteVortex(this.portal.x, this.portal.y, this.portal.color);
      }

      handlePlayerFall() {
        this.lives--;
        sound.playDeath();
        this.screenShake = 12;
        this.particles.emitDeathExplosion(this.player.x, this.height - 20);

        if (this.lives > 0) {
          this.player.startX = 480;
          this.player.startY = 240;
          this.player.reset();

          this.platforms.push(new UIPlatform({
            x: 430,
            y: 330,
            width: 100,
            height: 30,
            title: '[ RESPAWN ]',
            accentColor: '#00ff88',
            springY: 330,
            maxStandTimer: this.getCurrentStageConfig().breakTime * 1.5
          }));
        } else {
          this.gameOver();
        }
      }

      gameOver() {
        this.state = 'GAMEOVER';
        this.screenShake = 15;
      }

      update(dt) {
        for (const star of this.bgStars) {
          star.y += star.speed;
          if (star.y > this.height) {
            star.y = 0;
            star.x = Math.random() * this.width;
          }
        }

        if (this.screenShake > 0) {
          this.screenShake *= 0.9;
          if (this.screenShake < 0.1) this.screenShake = 0;
        }

        if (this.state === 'WARPING') {
          this.warpTimer -= dt;
          this.portal.update(dt, this.particles);
          this.particles.update();

          if (this.warpTimer <= 0) {
            const nextStage = this.currentStageIndex + 1;
            this.loadStage(nextStage, true);
          }
          return;
        }

        if (this.state === 'PLAYING') {
          this.survivalTime += dt;

          if (this.survivalTime > this.highScore) {
            this.highScore = this.survivalTime;
            localStorage.setItem('ultimo_pixel_highscore', this.highScore.toFixed(2));
          }

          const config = this.getCurrentStageConfig();

          this.spawnTimer += dt;
          if (this.spawnTimer >= config.spawnInterval || this.platforms.length < 4) {
            this.spawnRandomPlatform();
            this.spawnTimer = 0;
          }

          this.player.handleInput(this.keys);
          this.player.update(this.particles);

          this.portal.update(dt, this.particles);
          this.bits.forEach(b => b.update(dt));

          if (this.player.y > this.height + 20) {
            this.handlePlayerFall();
          }
        }

        for (let i = this.platforms.length - 1; i >= 0; i--) {
          const plat = this.platforms[i];
          plat.update(dt, 1.0 + (this.currentStageIndex * 0.1));

          if (plat.isCollapsing && !plat.emittedDebris) {
            plat.emittedDebris = true;
            this.screenShake = 6;
            this.particles.emitCollapseDebris(plat.x, plat.y, plat.width, plat.height, plat.accentColor);
          }

          if (plat.hasFallen) {
            this.platforms.splice(i, 1);
          }
        }

        if (this.state === 'PLAYING') {
          this.resolveCollisions();
        }

        this.particles.update();
      }

      draw() {
        this.ctx.save();

        if (this.screenShake > 0) {
          const sx = (Math.random() - 0.5) * this.screenShake;
          const sy = (Math.random() - 0.5) * this.screenShake;
          this.ctx.translate(sx, sy);
        }

        this.ctx.fillStyle = '#0a0d14';
        this.ctx.fillRect(0, 0, this.width, this.height);

        this.ctx.strokeStyle = 'rgba(0, 240, 255, 0.03)';
        this.ctx.lineWidth = 1;
        const gridSize = 40;
        for (let x = 0; x < this.width; x += gridSize) {
          this.ctx.beginPath();
          this.ctx.moveTo(x, 0);
          this.ctx.lineTo(x, this.height);
          this.ctx.stroke();
        }
        for (let y = 0; y < this.height; y += gridSize) {
          this.ctx.beginPath();
          this.ctx.moveTo(0, y);
          this.ctx.lineTo(this.width, y);
          this.ctx.stroke();
        }

        for (const star of this.bgStars) {
          this.ctx.fillStyle = `rgba(0, 240, 255, ${star.alpha})`;
          this.ctx.fillRect(star.x, star.y, star.size, star.size);
        }

        this.drawVoidDangerLine();

        this.portal.draw(this.ctx);

        for (const bit of this.bits) {
          bit.draw(this.ctx);
        }

        for (const plat of this.platforms) {
          plat.draw(this.ctx);
        }

        this.particles.draw(this.ctx);

        if (this.state === 'PLAYING' || this.state === 'START') {
          this.player.draw(this.ctx);
        }

        this.drawHUD();

        if (this.state === 'START') {
          this.drawStartOverlay();
        } else if (this.state === 'WARPING') {
          this.drawWarpOverlay();
        } else if (this.state === 'GAMEOVER') {
          this.drawGameOverOverlay();
        }

        this.ctx.restore();
      }

      drawVoidDangerLine() {
        const time = Date.now() * 0.003;
        const pulse = (Math.sin(time) + 1) * 0.5;

        const voidGrad = this.ctx.createLinearGradient(0, this.height - 28, 0, this.height);
        voidGrad.addColorStop(0, 'rgba(255, 0, 85, 0)');
        voidGrad.addColorStop(1, `rgba(255, 0, 85, ${0.15 + pulse * 0.1})`);

        this.ctx.fillStyle = voidGrad;
        this.ctx.fillRect(0, this.height - 28, this.width, 28);

        this.ctx.save();
        this.ctx.strokeStyle = `rgba(255, 51, 102, ${0.35 + pulse * 0.4})`;
        this.ctx.lineWidth = 2;
        this.ctx.setLineDash([8, 8]);
        this.ctx.beginPath();
        this.ctx.moveTo(0, this.height - 4);
        this.ctx.lineTo(this.width, this.height - 4);
        this.ctx.stroke();
        this.ctx.restore();
      }

      drawHUD() {
        this.ctx.save();
        const config = this.getCurrentStageConfig();

        this.ctx.font = 'bold 15px monospace';
        this.ctx.fillStyle = config.themeColor;
        this.ctx.shadowColor = config.themeColor;
        this.ctx.shadowBlur = 8;
        this.ctx.fillText(`FASE ${config.id}: ${config.name}`, 25, 32);

        this.ctx.shadowBlur = 0;
        this.ctx.fillStyle = '#8b949e';
        this.ctx.font = '11px monospace';
        this.ctx.fillText(config.sub, 25, 48);

        const collectedCount = this.bits.filter(b => b.isCollected).length;
        const totalBits = this.bits.length;
        this.ctx.font = 'bold 14px monospace';
        this.ctx.fillStyle = collectedCount === totalBits ? '#00ff88' : '#ffd700';
        this.ctx.shadowColor = this.ctx.fillStyle;
        this.ctx.shadowBlur = 6;
        this.ctx.fillText(`BITS: ${collectedCount}/${totalBits}`, 540, 34);

        if (this.portal.isOpen) {
          const flash = Math.sin(Date.now() * 0.008) > 0;
          this.ctx.fillStyle = flash ? '#00ff88' : '#ffffff';
          this.ctx.shadowColor = '#00ff88';
          this.ctx.shadowBlur = 10;
          this.ctx.fillText('PORTAL: [ABERTO]', 660, 34);
        } else {
          this.ctx.shadowBlur = 0;
          this.ctx.fillStyle = '#6e7681';
          this.ctx.fillText('PORTAL: [AGUARDANDO BITS]', 660, 34);
        }

        this.ctx.shadowBlur = 0;
        this.ctx.fillStyle = '#8b949e';
        this.ctx.font = 'bold 13px monospace';
        this.ctx.fillText('VIDAS:', this.width - 150, 34);
        for (let i = 0; i < this.maxLives; i++) {
          this.ctx.fillStyle = i < this.lives ? '#00ff88' : '#30363d';
          this.ctx.shadowColor = i < this.lives ? '#00ff88' : 'transparent';
          this.ctx.shadowBlur = i < this.lives ? 6 : 0;
          this.ctx.fillRect(this.width - 95 + i * 24, 22, 16, 14);
        }

        this.ctx.restore();
      }

      drawStartOverlay() {
        this.ctx.save();
        this.ctx.fillStyle = 'rgba(10, 13, 20, 0.78)';
        this.ctx.fillRect(0, 0, this.width, this.height);

        const boxW = 580;
        const boxH = 280;
        const boxX = (this.width - boxW) / 2;
        const boxY = 160;

        this.ctx.fillStyle = '#0d1117';
        this.ctx.fillRect(boxX, boxY, boxW, boxH);

        this.ctx.strokeStyle = '#00f0ff';
        this.ctx.shadowColor = '#00f0ff';
        this.ctx.shadowBlur = 14;
        this.ctx.lineWidth = 2;
        this.ctx.strokeRect(boxX, boxY, boxW, boxH);

        this.ctx.fillStyle = '#00f0ff';
        this.ctx.font = 'bold 22px monospace';
        this.ctx.textAlign = 'center';
        this.ctx.fillText('O ÚLTIMO PIXEL: SALTO DIMENSIONAL', this.width / 2, boxY + 44);

        this.ctx.shadowBlur = 0;
        this.ctx.fillStyle = '#e6edf3';
        this.ctx.font = '13px monospace';
        this.ctx.fillText('• Colete todos os Bits de Dados para abrir o Portal Quântico.', this.width / 2, boxY + 84);
        this.ctx.fillText('• Pule dentro do Portal para avançar para a próxima fase.', this.width / 2, boxY + 110);
        this.ctx.fillText('• Cada fase traz plataformas menores e tempo de quebra mais veloz.', this.width / 2, boxY + 136);
        this.ctx.fillText('• Cuidado nas pontas: seu peso faz o bloco deslizar e inclinar!', this.width / 2, boxY + 162);

        const flash = Math.sin(Date.now() * 0.006) > 0;
        this.ctx.fillStyle = flash ? '#00ff88' : '#38bdf8';
        this.ctx.shadowColor = '#00ff88';
        this.ctx.shadowBlur = flash ? 12 : 4;
        this.ctx.font = 'bold 16px monospace';
        this.ctx.fillText('Pressione [ESPAÇO] ou [W] para Iniciar', this.width / 2, boxY + 230);

        this.ctx.restore();
      }

      drawWarpOverlay() {
        this.ctx.save();
        const flash = (Math.sin(Date.now() * 0.015) + 1) * 0.5;
        this.ctx.fillStyle = `rgba(0, 240, 255, ${0.2 + flash * 0.25})`;
        this.ctx.fillRect(0, 0, this.width, this.height);

        this.ctx.textAlign = 'center';
        this.ctx.fillStyle = '#ffffff';
        this.ctx.shadowColor = '#00f0ff';
        this.ctx.shadowBlur = 24;
        this.ctx.font = 'bold 32px monospace';
        this.ctx.fillText('SALTO DIMENSIONAL CONCLUÍDO!', this.width / 2, this.height / 2 - 10);

        this.ctx.font = '16px monospace';
        this.ctx.fillStyle = '#00ff88';
        this.ctx.fillText('Carregando próximo setor...', this.width / 2, this.height / 2 + 30);

        this.ctx.restore();
      }

      drawGameOverOverlay() {
        this.ctx.save();
        this.ctx.fillStyle = 'rgba(7, 9, 14, 0.88)';
        this.ctx.fillRect(0, 0, this.width, this.height);

        this.ctx.textAlign = 'center';
        this.ctx.fillStyle = '#ff0055';
        this.ctx.shadowColor = '#ff0055';
        this.ctx.shadowBlur = 20;
        this.ctx.font = 'bold 36px monospace';
        this.ctx.fillText('SISTEMA CORROMPIDO', this.width / 2, 220);

        this.ctx.shadowBlur = 0;
        this.ctx.fillStyle = '#8b949e';
        this.ctx.font = '15px monospace';
        this.ctx.fillText('Você perdeu todos os seus Pixel Cores de backup.', this.width / 2, 260);

        const config = this.getCurrentStageConfig();
        this.ctx.fillStyle = '#00f0ff';
        this.ctx.font = 'bold 20px monospace';
        this.ctx.fillText(`Alcançou: Fase ${config.id} - ${config.name}`, this.width / 2, 310);
        this.ctx.fillText(`Tempo Total: ${this.survivalTime.toFixed(2)}s`, this.width / 2, 340);

        const btnW = 260;
        const btnH = 50;
        const btnX = this.width / 2 - btnW / 2;
        const btnY = 395;

        this.ctx.fillStyle = '#161b22';
        this.ctx.fillRect(btnX, btnY, btnW, btnH);

        this.ctx.strokeStyle = '#00ff88';
        this.ctx.shadowColor = '#00ff88';
        this.ctx.shadowBlur = 10;
        this.ctx.lineWidth = 2;
        this.ctx.strokeRect(btnX, btnY, btnW, btnH);

        this.ctx.fillStyle = '#00ff88';
        this.ctx.font = 'bold 15px monospace';
        this.ctx.fillText('REINICIAR CAMPANHA [R]', this.width / 2, btnY + 31);

        this.ctx.restore();
      }

      loop(timestamp) {
        const dt = Math.min((timestamp - this.lastTime) / 1000, 0.1);
        this.lastTime = timestamp;

        this.update(dt);
        this.draw();

        requestAnimationFrame((t) => this.loop(t));
      }

      start() {
        requestAnimationFrame((t) => {
          this.lastTime = t;
          this.loop(t);
        });
      }
    }

    // Inicialização da Engine quando a página carrega
    window.addEventListener('load', () => {
      const game = new GameEngine('gameCanvas');
      game.start();
    });
  </script>
</body>
</html>
